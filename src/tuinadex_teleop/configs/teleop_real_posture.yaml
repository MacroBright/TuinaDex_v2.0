# ==============================================================================
# TuinaDex v2.0 — 遥操真机端臂手准备姿态 (Ready Stance) 与运动参数配置文件
# 
# 说明:
# 1. 本文件是遥操真机端机械臂与灵巧手准备姿态 (Ready Pose) 和平滑起飞参数的统一配置文件;
# 2. 修改本文件数值后保存即可生效，无需重新编译 C++/Python 代码;
# 3. 机械臂角度推荐直接填写【角度 (deg)】，程序会自动进行弧度转换与物理限位校验。
# ==============================================================================

arm:
  # 6-DOF reBot 机械臂准备就绪姿态 (Tuina Ready Stance)
  # 默认对应手掌朝下、悬停在推拿床假人背部上方的安全就绪位
  ready_pose_deg:
    joint1: 0.0     # 基座旋转轴 (Yaw): 0.0° 正对床面 (-160° ~ +160°)
    joint2: 70.00   # 肩部俯仰轴 (Pitch): +70.00° (1.22 rad) 大臂向前抬起展开
    joint3: 55.00   # 肘部俯仰轴 (Pitch): +55.00° (0.96 rad) 小臂前屈
    joint4: -45.00  # 腕部俯仰轴 (Pitch): -45.00° (-0.79 rad) 手腕向下弯折正对床面
    joint5: 0.0     # 腕部偏航轴 (Yaw/侧摆): 0.0°
    joint6: 0.0     # 腕部滚转轴 (Roll): 0.0°

  # 机械臂平滑运动与安全限速参数
  motion:
    homing_duration_sec: 3.0    # 按下 [R] 键或一键回位时，从当前位置到准备姿态的平滑过渡耗时 (秒)
    max_speed_deg_s: 20.0       # 各关节运行最高限速 (°/s，防止突冲过快)

hand:
  # 16-DOF LEAP Hand 灵巧手初始准备姿态 (单位: rad, 0.0 为全平伸展开，屈曲向内弯曲为正)
  # 若推拿前需要特定手指预弯曲，可在此直接调整对应关节弧度
  ready_pose_rad:
    # 食指 Index (MCP侧摆, MCP屈伸, PIP屈伸, DIP屈伸)
    joint_0: 0.0
    joint_1: 0.0
    joint_2: 0.0
    joint_3: 0.0
    # 中指 Middle
    joint_4: 0.0
    joint_5: 0.0
    joint_6: 0.0
    joint_7: 0.0
    # 无名指 Ring
    joint_8: 0.0
    joint_9: 0.0
    joint_10: 0.0
    joint_11: 0.0
    # 拇指 Thumb
    joint_12: 0.0
    joint_13: 0.0
    joint_14: 0.0
    joint_15: 0.0

  # 灵巧手安全红线与抗抖滤波参数
  current_limit_ma: 150         # 舵机工作电流上限 (mA，硬保护杜绝堵转过热)
  filter_cutoff: 0.5            # 1€ 滤波静止截止频率 (越小静止越稳，推荐 0.3~0.6 消除高频微抖)
  filter_beta: 0.03             # 1€ 滤波动态响应系数 (手部快速移动跟踪灵敏度，推荐 0.02~0.05)
  filter_deadband: 0.012        # 静止死区弧度 (~0.69°，过滤手部视觉关键点微小漂移)

teleop:
  # 遥操与离合交互
  clutch_scale: 1.0             # 人手位移与机械臂末端移动缩放比例 (1.0 为 1:1)
  axis_mapping: "-y,-x,+z"      # 人手视觉坐标系到推拿床工作区坐标系的默认对齐映射 (旋转90度正向跟随)
  IMUaxis: "-y,+x,+z"           # 手腕 IMU 默认姿态对齐映射 (IMUaxis: 默认 +x,+y,+z)
  auto_engage: false            # 启动时是否自动挂离合 (默认 false: 安全断开挂起，需按空格激活)

