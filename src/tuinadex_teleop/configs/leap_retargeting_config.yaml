# ==============================================================================
# LEAP Hand Right Retargeting Configuration (DexPilot / Vector Optimizer)
# ==============================================================================

retargeting:
  type: DexPilot
  urdf_path: configs/urdf/leap_hand_right.urdf

  wrist_link_name: palm_lower
  finger_tip_link_names:
    - thumb_fingertip
    - fingertip
    - fingertip_2
    - fingertip_3

  target_joint_names:
    - index_yaw
    - index_mcp
    - index_pip
    - index_dip
    - middle_yaw
    - middle_mcp
    - middle_pip
    - middle_dip
    - ring_yaw
    - ring_mcp
    - ring_pip
    - ring_dip
    - thumb_yaw
    - thumb_cmc
    - thumb_mcp
    - thumb_ip

  # Human MediaPipe mapping for 4 fingers: [wrist(0), thumb(4), index(8), middle(12), ring/pinky(16)]
  human_keypoint_indices: [0, 4, 8, 12, 16]

  scaling_factor: 1.6
  low_pass_alpha: 0.25
  huber_delta: 0.03
  norm_delta: 0.004
