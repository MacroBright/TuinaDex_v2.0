# TuinaDex v2.0 - Unified Robot Configuration
# 6-DOF reBot Arm + 16-DOF LEAP Hand Coordinated Parameters

global:
  mode: "arm_hand"  # "hand_only", "arm_hand", "arm_only"
  control_rate_hz: 50.0
  watchdog_timeout_sec: 0.30
  watchdog_hold_sec: 0.30
  watchdog_ramp_sec: 0.60

arm:
  channel: "can0"
  bitrate: 1000000
  host_id: 253
  default_speed_deg_s: 30.0

hand:
  port: "/dev/ttyUSB0"
  baudrate: 4000000
  current_limit_ma: 150

sim:
  physics_timestep: 0.002
  physics_substeps: 10
  use_scene_world: true
  gui: false

