leap_hand_sim_node:
  ros__parameters:
    # 物理步长与时钟
    physics_timestep: 0.002           # 500 Hz MuJoCo 动力学步长
    publish_rate_hz: 50.0             # 50 Hz ROS2 通信降采样发布频率 (与真机 20ms 一致)
    
    # 通信话题契约 (与真机 100% 相同)
    command_topic: "/hand/joint_command"
    state_topic: "/hand/joint_states"
    
    # 安全与看门狗
    watchdog_timeout_sec: 0.3         # 300ms 无指令回退至 Relax-to-OPEN
    watchdog_hold_sec: 0.3            # 300ms 保持当前实测姿态
    watchdog_ramp_sec: 0.6            # 600ms 线性收敛到全开 0 rad
    physics_substeps: 10              # 每 20ms ROS tick 内 10 × 2ms = 500Hz 物理步进
    
    # 场景资产配置
    scene_file: "worlds/tuina_scene.xml"
    hand_only_file: "worlds/leap_hand_right.xml"
    use_scene_world: true             # true: 包含推拿床与假人, false: 纯灵巧手环境
